name: Release

# Dispara ao enviar uma tag de versão, por exemplo: git tag v0.2.3 && git push origin v0.2.3
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Confere se a tag corresponde à versão do package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não corresponde à versão $VERSION do package.json."
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run package

      - name: Cria o release com o .vsix anexado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.vsix --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
